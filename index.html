<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Naomi's Strawberry Cake Party 闖關主持面板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  --bg:#FBF3E4; --paper:#FFF9EF; --ink:#4A1418; --red:#C8202B; --red-d:#9E1620;
  --hl:#B5121F; --pink:#F4C6C9; --leaf:#4E7A3A; --silver:#C9CCD6; --gingham:rgba(200,32,43,.13);
  --line:rgba(74,20,24,.18);
  --serif:'Noto Serif TC','Songti TC','PMingLiU',serif;
  --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --display:'Abril Fatface','Noto Serif TC',Georgia,serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#2A0F12; --paper:#3B171B; --ink:#FBE9E3; --hl:#FF8A93; --pink:#7A2D34;
    --gingham:rgba(255,120,130,.10); --line:rgba(251,233,227,.22);
  }
}
:root[data-theme="dark"]{
  --bg:#2A0F12; --paper:#3B171B; --ink:#FBE9E3; --hl:#FF8A93; --pink:#7A2D34;
  --gingham:rgba(255,120,130,.10); --line:rgba(251,233,227,.22);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{color:var(--ink);font-family:var(--sans);line-height:1.6;background:#2a0f12;overflow:hidden;height:100vh}
#stage{
  position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;
  font-size:26px;display:flex;flex-direction:column;
  background-color:var(--bg);
  background-image:linear-gradient(90deg,var(--gingham) 50%,transparent 50%),linear-gradient(var(--gingham) 50%,transparent 50%);
  background-size:64px 64px;
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--red);outline-offset:3px}

/* header */
header{
  position:relative;flex:none;z-index:20;
  display:flex;align-items:center;gap:1.2em;flex-wrap:wrap;
  padding:.6em 1.4em;background:var(--red);color:#fff;
  border-bottom:4px double #fff;
}
.brand{font-family:var(--display);font-size:1.6em;letter-spacing:.01em;white-space:nowrap;cursor:pointer;background:none;border:0;color:#fff;padding:0}
nav{display:flex;gap:.3em;flex:1;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{
  background:transparent;border:2px solid transparent;color:#fff;padding:.25em .8em;border-radius:99px;white-space:nowrap;font-weight:500
}
nav button:hover{border-color:rgba(255,255,255,.6)}
nav button[aria-current="page"]{background:#fff;color:var(--red-d);font-weight:700}
.coinpill{display:flex;align-items:center;gap:.5em;background:#fff;color:var(--ink);padding:.15em 1em .15em .2em;border-radius:99px;font-weight:700}
.coin{
  width:2.1em;height:2.1em;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:900;color:#4b4f5c;
  background:radial-gradient(circle at 32% 28%,#fff 0,#e9ebf2 30%,#b9bdcb 70%,#8e93a4 100%);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.8),0 1px 3px rgba(0,0,0,.35)
}
.coinpill b{font-size:1.4em;font-family:var(--serif);min-width:1.6em;text-align:right}
.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.25)}}

main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:1em 2em 1.5em;width:100%}
h1,h2,h3{font-family:var(--serif);font-weight:900;margin:0;line-height:1.25}
.hl{color:var(--hl)}
.hint{opacity:.7;font-size:.85em}

/* home */
.badge-wrap{width:640px;aspect-ratio:1;filter:drop-shadow(0 12px 0 rgba(74,20,24,.12))}
.badge-wrap svg{width:100%;height:100%;display:block;overflow:visible}
.badge-spin{transform-origin:200px 200px;animation:pop 1.1s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(.2) rotate(-40deg);opacity:0}to{transform:none;opacity:1}}
.go{
  background:var(--red);color:#fff;border:0;border-radius:99px;padding:.6em 2em;font-size:1.3em;font-weight:700;
  box-shadow:0 5px 0 var(--red-d);transition:transform .12s,box-shadow .12s
}
.go:active{transform:translateY(4px);box-shadow:0 1px 0 var(--red-d)}
.fall{position:absolute;inset:0;overflow:hidden;z-index:-1;pointer-events:none}
.fall svg{position:absolute;top:-14%;animation:fall linear infinite;opacity:.9}
@keyframes fall{to{transform:translateY(1200px) rotate(360deg)}}

/* map */
.mapgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1.4em;margin-top:1.4em}
.stop{
  position:relative;background:var(--paper);border:3px solid var(--red);outline:1px solid var(--red);outline-offset:-9px;
  padding:1.6em 1.1em 1.2em;text-align:center;cursor:pointer;border-radius:6px;
  transition:transform .15s
}
.stop:hover{transform:rotate(-1.2deg) translateY(-4px)}
.stop svg.sb{width:4.6em;height:4.6em;display:block;margin:-3.2em auto .4em}
.stop h3{font-size:1.25em}
.stop p{margin:.3em 0 .6em;font-size:.88em;opacity:.8}
.stamp{display:inline-block;border:2px solid var(--line);border-radius:99px;padding:.05em .9em;font-size:.85em;font-weight:700}
.stamp.s1{border-color:var(--leaf);color:var(--leaf)}
.stamp.s2{background:var(--red);border-color:var(--red);color:#fff}
.stop .earn{display:block;margin-top:.5em;font-family:var(--serif);font-weight:900;color:var(--hl)}

/* level */
.lvhead{display:flex;align-items:center;gap:1em;margin-bottom:1em}
.lvhead svg{width:5.4em;height:5.4em;flex:none}
.lvhead h2{font-size:56px}
.lvhead .sub{font-size:1.1em;opacity:.8}
.cols{display:grid;grid-template-columns:1.35fr 1fr;gap:1.6em;align-items:start}
.recipe{
  background:var(--paper);border:3px solid var(--red);outline:1px solid var(--red);outline-offset:-9px;border-radius:6px;padding:1.5em 1.7em
}
.recipe h3{font-size:1.15em;color:var(--hl);margin:1em 0 .4em}
.recipe h3:first-child{margin-top:0}
.tags{display:flex;flex-wrap:wrap;gap:.4em;padding:0;margin:0;list-style:none}
.tags li{background:var(--pink);color:var(--ink);padding:.1em .8em;border-radius:99px;font-size:.92em}
.recipe ol{margin:0;padding-left:1.3em}
.recipe li+li{margin-top:.35em}
.goal{display:grid;grid-template-columns:auto 1fr;gap:.3em .8em;margin:0}
.goal dt{font-weight:700}
.goal dd{margin:0}
.say{margin-top:1.1em;padding:.7em 1em;border-left:6px solid var(--red);background:rgba(200,32,43,.07);font-family:var(--serif);font-weight:600}
.warn{margin-top:1em;font-size:.9em;padding:.5em .9em;background:#FFF1B8;color:#4a3b00;border-radius:6px}
.team{margin-top:1.1em;font-size:.9em;opacity:.85}

.panel{background:var(--red);color:#fff;border-radius:28px;padding:1.5em;text-align:center;box-shadow:0 8px 0 var(--red-d)}
.clock{
  font-family:var(--serif);font-weight:900;font-size:128px;line-height:1;letter-spacing:.02em;
  font-variant-numeric:tabular-nums;margin:.1em 0 .2em
}
.clock.low{animation:blink 1s steps(2) infinite;color:#FFE27A}
.clock.end{color:#FFE27A}
@keyframes blink{50%{opacity:.35}}
.row{display:flex;gap:.5em;justify-content:center;flex-wrap:wrap;margin:.5em 0}
.pb{background:#fff;color:var(--red-d);border:0;border-radius:99px;padding:.35em 1.1em;font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.pb:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.pb.ghost{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.7);box-shadow:none}
.pb[aria-pressed="true"]{background:#FFE27A;color:#5a1a00}
.sep{border:0;border-top:2px dashed rgba(255,255,255,.45);margin:1em 0}
.earned{font-family:var(--serif);font-weight:900;font-size:2em}
.stepper{display:flex;align-items:center;justify-content:center;gap:.7em;margin:.3em 0}
.stepper output{font-family:var(--serif);font-weight:900;font-size:2em;min-width:2.3em;display:inline-block}
.stepper button{width:2.2em;height:2.2em;border-radius:50%;border:0;background:#fff;color:var(--red-d);font-weight:900;font-size:1.1em}
.lab{display:block;font-weight:700}

/* shop */
.shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1.2em;margin-top:1.2em}
.item{background:var(--paper);border:3px solid var(--red);border-radius:6px;padding:1.2em;text-align:center}
.item h3{font-size:1.2em}
.price{display:flex;align-items:center;justify-content:center;gap:.4em;margin:.5em 0;font-family:var(--serif);font-weight:900;font-size:1.4em}
.price .coin{font-size:.7em}
.item button{background:var(--red);color:#fff;border:0;border-radius:99px;padding:.35em 1.4em;font-weight:700;box-shadow:0 3px 0 var(--red-d)}
.item button:disabled{opacity:.4;cursor:not-allowed}
.banner{margin-top:1em;background:var(--red);color:#fff;border-radius:20px;padding:1em 1.4em;display:flex;gap:1em;align-items:center;flex-wrap:wrap}
.banner b{font-family:var(--serif);font-size:1.3em}

/* settings */
.form{display:grid;gap:1.2em;margin-top:1em}
fieldset{border:3px solid var(--red);border-radius:6px;background:var(--paper);padding:1em 1.3em;margin:0}
legend{font-family:var(--serif);font-weight:900;color:var(--hl);padding:0 .5em}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.7em 1em}
.f label{display:flex;flex-direction:column;font-size:.85em;font-weight:700;gap:.15em}
input[type=text],input[type=number]{
  font:inherit;padding:.3em .6em;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%
}
.danger{background:transparent;border:2px solid var(--red);color:var(--hl);border-radius:99px;padding:.35em 1.2em;font-weight:700}


/* intro */
body.in-intro nav,body.in-intro .coinpill{visibility:hidden}
.intro{position:relative;min-height:880px;display:grid;align-items:center;isolation:isolate}
.slide{display:grid;justify-items:center;text-align:center;gap:.5em}
.slide h1{font-size:68px}
.slide p{margin:0;font-size:1.1em}
.intro .badge-wrap{width:520px}
.go.alt{background:transparent;color:var(--hl);box-shadow:none;border:3px solid var(--red)}
.btns{display:flex;gap:1em;justify-content:center;flex-wrap:wrap;margin-top:.6em}
.dots{display:flex;gap:.5em;justify-content:center;margin-top:.8em}
.dots i{width:.7em;height:.7em;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--red)}
.story{display:grid;grid-template-columns:1.1fr .9fr;gap:3em;align-items:center;text-align:left;width:100%}
.story p{font-family:var(--serif);font-weight:600;font-size:1.25em;line-height:1.9;margin:.6em 0}
.path{display:grid;gap:.9em}
.path .st{display:flex;align-items:center;gap:1em;background:var(--paper);border:3px solid var(--red);border-radius:6px;padding:.5em 1em;text-align:left;opacity:0;animation:rise .5s forwards}
.path .st svg{width:3.2em;height:3.2em;flex:none}
@keyframes rise{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.tips{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4em;width:100%;margin-top:1em;text-align:left}
.tip{background:var(--paper);border:3px solid var(--red);outline:1px solid var(--red);outline-offset:-9px;border-radius:6px;padding:1.4em 1.5em;opacity:0;animation:popin .6s cubic-bezier(.2,1.4,.4,1) forwards}
.tip .tag{display:inline-block;background:var(--red);color:#fff;border-radius:99px;padding:.05em .9em;font-size:.85em;font-weight:700}
.tip h3{font-size:1.3em;margin:.4em 0 .3em}
.tip p{font-size:1em;line-height:1.75}
@keyframes popin{from{opacity:0;transform:scale(.6) translateY(30px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.st,.tip{animation:none;opacity:1}}

/* menu */
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:1em;align-items:start;font-size:.64em;margin-top:.6em}
.mcol{display:grid;gap:1em}
.cat{background:var(--paper);border:2px solid var(--red)}
.cat h3{background:var(--red);color:#fff;font-size:1.05em;padding:.2em .8em;letter-spacing:.25em}
.mi{display:grid;grid-template-columns:1fr auto auto;gap:.7em;align-items:center;padding:.15em .7em;border-top:1px solid var(--line)}
.mi .p{font-family:var(--serif);font-weight:900;color:var(--hl);min-width:2.8em;text-align:right}
.mi .q{display:flex;align-items:center;gap:.3em}
.mi .q button{width:1.9em;height:1.9em;border-radius:50%;border:2px solid var(--red);background:transparent;color:var(--hl);font-weight:900;line-height:1;padding:0}
.mi .q button:disabled{opacity:.25;cursor:not-allowed}
.mi .q output{min-width:1.4em;text-align:center;font-weight:700}
.mi.on{background:rgba(200,32,43,.10)}
.order{text-align:left}
.order .earned{text-align:center}
.order ul{margin:.3em 0;padding-left:1.2em}
.pb:disabled{opacity:.4;cursor:not-allowed}

/* popups & typewriter */
.pops{display:grid;grid-template-columns:repeat(5,1fr);gap:1.2em;width:100%;margin-top:1.2em}
.pop{background:var(--paper);border:3px solid var(--ink);border-radius:14px;overflow:hidden;box-shadow:6px 6px 0 rgba(74,20,24,.28);opacity:0;animation:popwin .55s cubic-bezier(.2,1.5,.4,1) forwards}
.pop .bar{background:var(--red);color:#fff;padding:.25em .8em;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:.9em}
.pop .bar i{display:inline-block;width:.6em;height:.6em;border-radius:50%;background:#fff;opacity:.85;margin-left:.25em}
.pop .body{padding:.9em .8em 1em;display:grid;justify-items:center;gap:.25em}
.pop .body svg{width:3.6em;height:3.6em}
.pop b{font-family:var(--serif);font-size:1.15em;line-height:1.3}
.pop .ok{margin-top:.4em;border:2px solid var(--red);border-radius:6px;padding:0 1.2em;font-weight:700;color:var(--hl);font-size:.85em}
@keyframes popwin{0%{opacity:0;transform:scale(.3) rotate(var(--r,0deg)) translateY(40px)}100%{opacity:1;transform:rotate(var(--r,0deg))}}
.lead{max-width:44em;font-family:var(--serif);font-weight:600;line-height:1.8}
.menu.small{font-size:.62em;margin-top:.6em;width:100%;text-align:left}
.menu.small .mi.ro{grid-template-columns:1fr auto}
.caption{width:100%;max-width:60em;margin-top:.6em;padding:.5em 1em;border-left:6px solid var(--red);background:rgba(200,32,43,.08);text-align:left;font-size:.95em;min-height:2.8em;display:flex;align-items:center}
.cur::after{content:'';display:inline-block;width:.12em;height:1.1em;background:var(--red);margin-left:.15em;vertical-align:-.15em;animation:blink 1s steps(2) infinite}
#typer div{margin:.3em 0}
.rulepage{display:grid;grid-template-columns:auto 1fr;gap:3.5em;align-items:center;width:100%;padding:0 2em}
.menuimg{height:850px;width:auto;display:block;background:#fff;border:4px solid var(--red);border-radius:6px;box-shadow:12px 12px 0 rgba(74,20,24,.22);transform:rotate(-1.5deg);animation:pop .9s cubic-bezier(.2,1.4,.4,1) both}
.rtext{text-align:left;display:grid;gap:.7em}
.rtext h1{font-size:60px}
.rtext .caption{max-width:none;font-size:.9em;min-height:10.5em;align-items:flex-start;padding:.8em 1.2em}
.rtext .btns{justify-content:flex-start}
.rtext .dots{justify-content:flex-start}
@media (prefers-reduced-motion:reduce){.cur::after{animation:none}.pop{animation:none;opacity:1;transform:rotate(var(--r,0deg))}}

#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
@media (prefers-reduced-motion:reduce){
  .fall svg,.badge-spin,.clock.low,.bump{animation:none}
  .stop{transition:none}
}
</style>
</head>

<div id="stage">
<header>
  <button class="brand" data-go="intro" aria-label="回到開場畫面">Naomi's 23rd</button>
  <nav id="nav" aria-label="頁面切換"></nav>
  <div class="coinpill" title="目前擁有的甯甯幣"><span class="coin">甯</span><b id="coinTotal">0</b></div>

<main id="view"></main>

<canvas id="confetti"></canvas>

<script>
/* ============ 資料 ============ */
const LEVELS = {

    rules:['Naomi 站在桌前，只有她能碰盤子。','三位朋友負責遞蛋糕片、擠鮮奶油、遞草莓，每次只能遞一樣。','60 秒內疊出一個蛋糕，頂端要放一顆草莓。'],
    pass:'疊到 4 層，草莓在最上面且不倒。',perfect:'疊到 6 層，或 40 秒內完成。',
    say:'「Naomi，這是全世界最甜的蛋糕，別讓它倒下！」'},
  3:{name:'蒙眼餵草莓',short:'蒙眼餵',sub:'聽朋友的口令，把草莓夾進小碗',secs:60,
    items:['眼罩','夾子或湯匙','草莓 10 顆散放在大盤','小碗'],
    rules:['Naomi 戴上眼罩，手拿夾子。','三位朋友輪流下口令，只能說「左、右、前、後、停、夾」。','60 秒內把草莓夾進小碗，掉在桌上的不算。'],
    pass:'夾進 5 顆草莓。',perfect:'夾進 8 顆草莓。',
    say:'「仔細聽口令，草莓在等你！」'},

let twTimer=null;
function startTypewriter(){
  clearTimeout(twTimer);
  const el=document.getElementById('typer'); if(!el) return;
  if(matchMedia('(prefers-reduced-motion:reduce)').matches){ el.innerHTML=TW_LINES.map(l=>`<div>${l}</div>`).join(''); return; }
  el.innerHTML=''; let li=0,ci=0,row=null;
  (function step(){
    if(!document.getElementById('typer')||li>=TW_LINES.length) return;
    if(ci===0){ if(row) row.classList.remove('cur'); row=document.createElement('div'); row.className='cur'; el.appendChild(row); }
    const line=TW_LINES[li];
    if(ci<=line.length){ row.textContent=line.slice(0,ci++); twTimer=setTimeout(step,65); }
    else twTimer=setTimeout(()=>{ li++; ci=0; step(); },900);
  })();
}

/* ============ SVG 元件 ============ */
function scallop(cx,cy,r,n){
  const b=r*Math.sin(Math.PI/n); let d='';
  for(let i=0;i<=n;i++){
    const a=2*Math.PI*i/n-Math.PI/2, x=(cx+r*Math.cos(a)).toFixed(2), y=(cy+r*Math.sin(a)).toFixed(2);
    d+= i===0 ? `M${x} ${y}` : `A${b.toFixed(2)} ${b.toFixed(2)} 0 0 1 ${x} ${y}`;
  }
  return d+'Z';
}
function numBadge(n,cls=''){
  return `<svg class="sb ${cls}" viewBox="0 0 100 100" aria-hidden="true">
    <path d="${scallop(50,50,46,14)}" fill="var(--red)" stroke="#fff" stroke-width="0"/>
    <circle cx="50" cy="50" r="36" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="2 4" stroke-linecap="round"/>
    <text x="50" y="66" text-anchor="middle" font-family="Abril Fatface,Noto Serif TC,serif" font-size="46" fill="#fff">${n}</text></svg>`;
}

      <img class="menuimg" src="${MENU_IMG}" alt="黃油螺螄粉火鍋菜單">
      <div class="rtext">
        <h1>甯甯幣可以換這些</h1>
        <p class="lead" style="margin:0">闖關賺到的甯甯幣，可以換成今晚火鍋的晚餐券，菜單上的金額就是需要的甯甯幣數量。</p>
        <div class="caption"><div id="typer" aria-live="polite"></div></div>
        <div class="btns"><button class="go alt" data-act="istep" data-d="-1">上一頁</button><button class="go" data-go="map">開始闖關</button></div>${dots}
      </div></div></section>`;
}

function vMap(){
  const stops=[1,2,3,4,5].map(i=>`<div class="stop" role="button" tabindex="0" data-go="${i}">
      ${numBadge(i)}<h3>${LEVELS[i].name}</h3><p>${LEVELS[i].sub}</p>${stateStamp(i)}
      <span class="earn">${levelCoins(i)?'+'+levelCoins(i)+' 甯甯幣':'&nbsp;'}</span></div>`).join('');
  return `<h2>闖關地圖</h2><p class="hint">點選關卡進入，也可以用鍵盤左右鍵切換頁面。</p>
    <div class="mapgrid" style="margin-top:3em">${stops}</div>
    <div class="banner"><b>已賺到 ${earnedAll()} 枚，還剩 ${balance()} 枚可兌換</b>
      <button class="pb" data-go="shop" style="margin-left:auto">前往晚餐兌換</button></div>`;
}

function timerBlock(secs){
  return `<div class="clock" id="clock">--:--</div>
    <div class="row">
      <button class="pb" data-act="tstart" id="tbtn">開始</button>
      <button class="pb ghost" data-act="treset">重設</button>
    </div><hr class="sep">`;
}

function vLevel(i){
  const L=LEVELS[i];
  const list=a=>a.map(x=>`<li>${esc(x)}</li>`).join('');
  const recipe=`<div class="recipe">
      <h3>準備材料</h3><ul class="tags">${list(L.items)}</ul>
      <h3>玩法</h3><ol>${list(L.rules)}</ol>
      <h3>${i===1?'換幣方式':'過關條件'}</h3>
      <dl class="goal">${i===1?`<dt>說明</dt><dd>${esc(L.pass)}</dd><dt>備註</dt><dd>${esc(L.perfect)}</dd>`:
        `<dt>通過</dt><dd>${esc(L.pass)}</dd><dt>完美</dt><dd>${esc(L.perfect)}</dd>`}</dl>
      ${L.warn?`<div class="warn">${esc(L.warn)}</div>`:''}
      <div class="say">${esc(L.say)}</div>
      <div class="team">本關隊員：${S.players.map(esc).join('、')}</div>
    </div>`;
  let panel;
  if(i===1){
    const l=S.l1, ub=l.big-l.bigFound, us=l.small-l.smallFound;
    panel=`<div class="panel">
      <span class="lab">大隻小人，已找到</span>
      <div class="stepper"><button data-act="l1" data-k="bigFound" data-d="-1" aria-label="減一">−</button><output>${l.bigFound}<small> / ${l.big}</small></output><button data-act="l1" data-k="bigFound" data-d="1" aria-label="加一">＋</button></div>
      <span class="lab">小隻小人（稀有），已找到</span>
      <div class="stepper"><button data-act="l1" data-k="smallFound" data-d="-1" aria-label="減一">−</button><output>${l.smallFound}<small> / ${l.small}</small></output><button data-act="l1" data-k="smallFound" data-d="1" aria-label="加一">＋</button></div>
      <hr class="sep">
      <div>沒被找到：大 ${ub} 隻 × ${l.bigRate}、小 ${us} 隻 × ${l.smallRate}</div>
      <div class="earned">${(ub*l.bigRate+us*l.smallRate)} 甯甯幣</div>
      <div class="row"><button class="pb" data-act="settle" aria-pressed="${l.settled}">${l.settled?'已結算，點此取消':'結算並發幣'}</button></div>
    </div>`;
  } else {
    const l=S.lv[i];
    panel=`<div class="panel">${timerBlock(L.secs)}
      <span class="lab">挑戰結果</span>
      <div class="row">
        <button class="pb" data-act="res" data-i="${i}" data-v="1" aria-pressed="${l.res===1}">通過 +${l.base}</button>
        <button class="pb" data-act="res" data-i="${i}" data-v="2" aria-pressed="${l.res===2}">完美 +${l.base+l.bonus}</button>
        <button class="pb ghost" data-act="res" data-i="${i}" data-v="0">重來</button>
      </div>
      <div class="earned">本關 ${lvCoins(i)} 甯甯幣</div></div>`;
  }
  const next=i<5?`<button class="pb" style="background:var(--red);color:#fff" data-go="${i+1}">下一關</button>`:`<button class="pb" style="background:var(--red);color:#fff" data-go="shop">前往晚餐兌換</button>`;
  return `<div class="lvhead">${numBadge(i)}<div><h2>${L.name}</h2><div class="sub">${L.sub}</div></div></div>
    <div class="cols">${recipe}<div>${panel}<div class="row" style="justify-content:flex-end;margin-top:1em">${next}</div></div></div>`;
}

function pendingTotal(){ return Object.entries(S.order).reduce((s,[n,q])=>s+PRICE[n]*q,0); }
function catHtml(ci){
  const c=MENU[ci];
  return `<div class="cat"><h3>${c.c}</h3>${c.i.map(([n,p])=>{
    const q=S.order[n]||0, got=S.bought[n]||0, can=pendingTotal()+p<=balance();
    return `<div class="mi ${q?'on':''}"><span>${esc(n)}${got?` <small class="hint">（已換 ${got}）</small>`:''}</span>
      <span class="p">${p===0?'Free':p}</span>
      <span class="q"><button data-act="qty" data-n="${esc(n)}" data-d="-1" ${q?'':'disabled'} aria-label="減少 ${esc(n)}">−</button><output>${q}</output><button data-act="qty" data-n="${esc(n)}" data-d="1" ${can?'':'disabled'} aria-label="增加 ${esc(n)}">＋</button></span></div>`;
  }).join('')}</div>`;
}
function vShop(){
  const pend=Object.entries(S.order).filter(([,q])=>q>0), bought=Object.entries(S.bought).filter(([,q])=>q>0);
  const order=`<div class="panel order">
      <span class="lab" style="text-align:center">可用甯甯幣</span><div class="earned">${balance()}</div><hr class="sep">
      <span class="lab">本次點單</span>
      <ul>${pend.length?pend.map(([n,q])=>`<li>${esc(n)} × ${q}（${PRICE[n]*q}）</li>`).join(''):'<li>還沒有選擇</li>'}</ul>
      <div>合計 ${pendingTotal()} 枚，兌換後剩 ${balance()-pendingTotal()} 枚</div>
      <div class="row"><button class="pb" data-act="confirm" ${pend.length?'':'disabled'}>確認兌換</button><button class="pb ghost" data-act="clearorder">清空</button></div>
      ${bought.length?`<hr class="sep"><span class="lab">已兌換的晚餐券</span><p style="margin:.3em 0 0">${bought.map(([n,q])=>esc(n)+' × '+q).join('、')}</p>`:''}
    </div>`;
  return `<div class="lvhead"><div><h2>黃油螺螄粉火鍋　晚餐兌換</h2><div class="sub">用甯甯幣點餐，換成今晚的晚餐券。${allDone()?'五關都完成了，太棒了 Naomi！':''}</div></div>
      <button class="pb" style="margin-left:auto;background:var(--red);color:#fff" data-act="party">灑草莓慶祝</button></div>
    <div class="menu">
      <div class="mcol">${catHtml(0)}${catHtml(1)}${catHtml(4)}</div>
      <div class="mcol">${catHtml(2)}${catHtml(5)}</div>
      <div class="mcol">${catHtml(3)}${order}</div>
    </div>`;
}

function vSettings(){
  const f=(label,path,val,type='number')=>`<label>${label}<input type="${type}" data-set="${path}" value="${esc(val)}" ${type==='number'?'min="0"':''}></label>`;
  return `<h2>活動設定</h2><p class="hint">修改後會自動儲存在這台裝置的瀏覽器。</p>
  <div class="form">
    <fieldset><legend>隊員名字</legend><div class="f">${S.players.map((p,i)=>f('隊員 '+(i+1),'players.'+i,p,'text')).join('')}</div></fieldset>
    <fieldset><legend>第一關 尋小人</legend><div class="f">
      ${f('大隻數量','l1.big',S.l1.big)}${f('小隻數量','l1.small',S.l1.small)}
      ${f('大隻換幾枚','l1.bigRate',S.l1.bigRate)}${f('小隻換幾枚','l1.smallRate',S.l1.smallRate)}</div></fieldset>
    <fieldset><legend>第二到第五關 獎勵</legend><div class="f">
      ${[2,3,4,5].map(i=>f(LEVELS[i].short+' 通過','lv.'+i+'.base',S.lv[i].base)+f(LEVELS[i].short+' 完美加碼','lv.'+i+'.bonus',S.lv[i].bonus)).join('')}</div></fieldset>
    <div><button class="danger" data-act="reset">清除所有紀錄，重新開始</button></div>
  </div>`;
}

function render(){
  renderNav();
  document.body.classList.toggle('in-intro',view==='intro');
  const el=document.getElementById('view');
  el.innerHTML = view==='intro'?vIntro():view==='map'?vMap():view==='shop'?vShop():view==='settings'?vSettings():vLevel(view);
  const c=document.getElementById('coinTotal'), b=balance();
  if(+c.textContent!==b){c.textContent=b;c.classList.remove('bump');void c.offsetWidth;c.classList.add('bump');}
  paintClock();
  if(view==='intro'&&introStep===2) startTypewriter(); else clearTimeout(twTimer);
}
function go(v){
  const n=isNaN(+v)?v:+v;
  if(n===view) return;
  view=n; if(n==='intro') introStep=0; stopTimer(); loadTimer(); render(); document.getElementById('view').scrollTop=0;
}

/* ============ 計時器 ============ */
let T={left:0,run:false,id:null};
function loadTimer(){ T.left = (typeof view==='number' && LEVELS[view].secs) ? LEVELS[view].secs : 0; T.run=false; }
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function paintClock(){
  const c=document.getElementById('clock'); if(!c) return;
  c.textContent=fmt(T.left);
  c.classList.toggle('low',T.run&&T.left<=10&&T.left>0);
  c.classList.toggle('end',T.left===0&&!T.run&&typeof view==='number');
  const b=document.getElementById('tbtn'); if(b) b.textContent=T.run?'暫停':(T.left===0?'時間到':'開始');
}
function beep(f=880,d=.25){ try{ const a=new (window.AudioContext||window.webkitAudioContext)(); const o=a.createOscillator(),g=a.createGain(); o.frequency.value=f;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.2,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.start();o.stop(a.currentTime+d);}catch(e){} }
function stopTimer(){ clearInterval(T.id); T.run=false; }
function toggleTimer(){
  if(T.run){ stopTimer(); paintClock(); return; }
  if(T.left<=0) return;
  T.run=true; beep(660,.15);
  T.id=setInterval(()=>{
    T.left--; if(T.left<=3&&T.left>0) beep(700,.1);
    if(T.left<=0){ T.left=0; stopTimer(); beep(500,.8); }
    paintClock();
  },1000);
  paintClock();
}

/* ============ 互動 ============ */
function setPath(path,val){
  const p=path.split('.'); let o=S; for(let i=0;i<p.length-1;i++) o=o[p[i]]; o[p[p.length-1]]=val;
}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){ go(g.dataset.go); return; }
  const a=e.target.closest('[data-act]'); if(!a) return;
  const act=a.dataset.act;
  if(act==='tstart') toggleTimer();
  else if(act==='treset'){ stopTimer(); loadTimer(); paintClock(); }
  else if(act==='res'){ const i=+a.dataset.i, v=+a.dataset.v; S.lv[i].res = (S.lv[i].res===v?0:v); if(S.lv[i].res>0) burst(S.lv[i].res===2?120:60); save(); render(); }
  else if(act==='l1'){ const k=a.dataset.k, max=k==='bigFound'?S.l1.big:S.l1.small; S.l1[k]=Math.max(0,Math.min(max,S.l1[k]+ +a.dataset.d)); S.l1.settled=false; save(); render(); }
  else if(act==='settle'){ S.l1.settled=!S.l1.settled; if(S.l1.settled) burst(80); save(); render(); }
  else if(act==='istep'){ +a.dataset.d>0 ? nextIntro() : prevIntro(); }
  else if(act==='qty'){ const n=a.dataset.n, d=+a.dataset.d, q=(S.order[n]||0)+d;
    if(q<0) return; if(d>0 && pendingTotal()+PRICE[n]>balance()) return;
    if(q===0) delete S.order[n]; else S.order[n]=q; save(); render(); }
  else if(act==='clearorder'){ S.order={}; save(); render(); }
  else if(act==='confirm'){ const tot=pendingTotal(); if(tot<=balance() && Object.keys(S.order).length){
    S.spent+=tot; Object.entries(S.order).forEach(([n,q])=>S.bought[n]=(S.bought[n]||0)+q); S.order={}; burst(80); save(); render(); } }
  else if(act==='party') burst(200);
  else if(act==='reset'){ if(confirm('確定要清除所有紀錄嗎？')){ S=structuredClone(DEF); save(); render(); } }
});
document.addEventListener('change',e=>{
  const s=e.target.closest('[data-set]'); if(!s) return;
  setPath(s.dataset.set, s.type==='number'?Math.max(0,+s.value||0):s.value);
  save(); render();
});
document.addEventListener('keydown',e=>{
  if(/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if(view==='intro'){
    if(['ArrowRight',' ','Enter'].includes(e.key)){ e.preventDefault(); nextIntro(); }
    else if(e.key==='ArrowLeft') prevIntro();
    return;
  }
  const i=VIEWS.indexOf(view);
  if(e.key==='ArrowRight'&&i<VIEWS.length-1) go(VIEWS[i+1]);
  else if(e.key==='ArrowLeft'&&i>0) go(VIEWS[i-1]);
  else if(e.key===' '&&document.getElementById('tbtn')){ e.preventDefault(); toggleTimer(); }
  else if(e.key==='Enter'&&document.activeElement.classList.contains('stop')) go(document.activeElement.dataset.go);
});

/* ============ 彩帶 ============ */
const cv=document.getElementById('confetti'), cx=cv.getContext('2d');
let P=[], raf=null;
function fit(){ cv.width=innerWidth*devicePixelRatio; cv.height=innerHeight*devicePixelRatio; }
addEventListener('resize',fit); fit();
function burst(n){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const cols=['#C8202B','#F4C6C9','#FFFFFF','#C9CCD6','#4E7A3A','#F6D98B'];
  for(let i=0;i<n;i++) P.push({x:innerWidth*(.2+Math.random()*.6),y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:4+Math.random()*7,c:cols[i%cols.length],rot:Math.random()*6,vr:(Math.random()-.5)*.4,h:Math.random()<.2});
  if(!raf) raf=requestAnimationFrame(tick);
}
function tick(){
  const d=devicePixelRatio; cx.clearRect(0,0,cv.width,cv.height);
  P.forEach(p=>{ p.vy+=.35; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
    cx.save(); cx.translate(p.x*d,p.y*d); cx.rotate(p.rot); cx.fillStyle=p.c;
    if(p.h){ cx.font=(p.r*3*d)+'px serif'; cx.fillText('♥',0,0); } else cx.fillRect(-p.r*d/2,-p.r*d/2,p.r*d,p.r*d*1.6);
    cx.restore(); });
  P=P.filter(p=>p.y<innerHeight+40);
  raf = P.length?requestAnimationFrame(tick):null;
  if(!P.length) cx.clearRect(0,0,cv.width,cv.height);
}

function fitStage(){
  const st=document.getElementById('stage'), s=Math.min(innerWidth/1920,innerHeight/1080);
  st.style.transform='scale('+s+')';
  st.style.left=((innerWidth-1920*s)/2)+'px'; st.style.top=((innerHeight-1080*s)/2)+'px';
}
addEventListener('resize',fitStage); fitStage();
render();
</script>
</body>
</html>
